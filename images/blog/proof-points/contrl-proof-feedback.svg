<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="A slide with a generic claim, one line of chat feedback giving the real figure, and the rewritten slide that states the claim with its proof and the RFP requirement it answers" font-family="'Pretendard', -apple-system, 'Helvetica Neue', Arial, sans-serif"><title>A slide with a generic claim, one line of chat feedback giving the real figure, and the rewritten slide that states the claim with its proof and the RFP requirement it answers</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="470" fill="#fff"/><text x="40" y="50.0" font-size="18" font-weight="700" fill="#71717a" text-anchor="start">Draft page</text><text x="440" y="50.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">Your feedback</text><text x="820" y="50.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">Rewritten page</text><rect x="40" y="70" width="340" height="300" rx="14" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="6 6"/><text x="64" y="116.0" font-size="22" font-weight="700" fill="#52525b" text-anchor="start">Extensive migration</text><text x="64" y="146.8" font-size="22" font-weight="700" fill="#52525b" text-anchor="start">experience</text><rect x="64" y="183.6" width="260" height="8" rx="4" fill="#d4d4d8"/><rect x="64" y="205.6" width="260" height="8" rx="4" fill="#d4d4d8"/><rect x="64" y="227.6" width="260" height="8" rx="4" fill="#d4d4d8"/><rect x="64" y="249.6" width="156.0" height="8" rx="4" fill="#d4d4d8"/><rect x="64" y="300" width="104.2" height="31" rx="15.5" fill="#d4d4d8"/><text x="78" y="318.0" font-size="15" font-weight="700" fill="#52525b" text-anchor="start">Claim only</text><line x1="384" y1="220" x2="436" y2="220" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="440" y="70" width="340" height="300" rx="14" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="464" y="145.8" font-size="16" font-weight="600" fill="#71717a" text-anchor="start">From your records</text><rect x="464" y="163.8" width="292" height="146.39999999999998" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="482" y="197.8" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">“Use our record: 14 site</text><text x="482" y="224.4" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">cutovers since 2021, none</text><text x="482" y="251.0" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">outside the downtime</text><text x="482" y="277.6" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">window.”</text><line x1="784" y1="220" x2="816" y2="220" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="820" y="70" width="340" height="300" rx="14" fill="#fff" stroke="#F27A2E" stroke-width="2"/><text x="844" y="116.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">Staged cutover keeps</text><text x="844" y="145.4" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">services running</text><rect x="844" y="176.8" width="292" height="69.2" rx="10" fill="#f9f6f2"/><rect x="844" y="176.8" width="6" height="69.2" rx="3" fill="#F27A2E"/><text x="864" y="202.8" font-size="16" font-weight="600" fill="#b7551b" text-anchor="start">14 cutovers since 2021,</text><text x="864" y="224.4" font-size="16" font-weight="600" fill="#b7551b" text-anchor="start">none outside the agreed window</text><rect x="844" y="262.0" width="156.0" height="8" rx="4" fill="#e2d6c9"/><rect x="844" y="316" width="196.0" height="31" rx="15.5" fill="#18181b"/><text x="858" y="334.0" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Answers RFP req. 3.2</text><text x="600.0" y="428.0" font-size="19" font-weight="400" fill="#71717a" text-anchor="middle">AI can’t invent your proof. Give it the real figure, and the claim and its evidence share a page.</text></svg>
