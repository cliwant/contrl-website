<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="一页只有空泛主张的幻灯片，通过一句对话反馈给出真实数字后，被改写成主张、证据和所回应的招标需求同在一页" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><title>一页只有空泛主张的幻灯片，通过一句对话反馈给出真实数字后，被改写成主张、证据和所回应的招标需求同在一页</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="470" fill="#fff"/><text x="40" y="50.0" font-size="18" font-weight="700" fill="#71717a" text-anchor="start">初稿页面</text><text x="440" y="50.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">一句反馈</text><text x="820" y="50.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">改写后的页面</text><rect x="40" y="70" width="340" height="300" rx="14" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="6 6"/><text x="64" y="116.0" font-size="22" font-weight="700" fill="#52525b" text-anchor="start">丰富的系统迁移经验</text><rect x="64" y="152.8" width="260" height="8" rx="4" fill="#d4d4d8"/><rect x="64" y="174.8" width="260" height="8" rx="4" fill="#d4d4d8"/><rect x="64" y="196.8" width="260" height="8" rx="4" fill="#d4d4d8"/><rect x="64" y="218.8" width="156.0" height="8" rx="4" fill="#d4d4d8"/><rect x="64" y="300" width="88" height="31" rx="15.5" fill="#d4d4d8"/><text x="78" y="318.0" font-size="15" font-weight="700" fill="#52525b" text-anchor="start">只有主张</text><line x1="384" y1="220" x2="436" y2="220" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="440" y="70" width="340" height="300" rx="14" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="464" y="159.1" font-size="16" font-weight="600" fill="#71717a" text-anchor="start">来自公司记录</text><rect x="464" y="177.1" width="292" height="119.8" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="482" y="211.1" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">“换成实绩：</text><text x="482" y="237.7" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">2021年以来切换了14个站点，</text><text x="482" y="264.3" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">无一超出约定停机时间。”</text><line x1="784" y1="220" x2="816" y2="220" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="820" y="70" width="340" height="300" rx="14" fill="#fff" stroke="#F27A2E" stroke-width="2"/><text x="844" y="116.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">分阶段切换，服务不中断</text><rect x="844" y="147.4" width="292" height="69.2" rx="10" fill="#f9f6f2"/><rect x="844" y="147.4" width="6" height="69.2" rx="3" fill="#F27A2E"/><text x="864" y="173.4" font-size="16" font-weight="600" fill="#b7551b" text-anchor="start">2021年以来14个站点切换，</text><text x="864" y="195.0" font-size="16" font-weight="600" fill="#b7551b" text-anchor="start">无一超出约定停机时间</text><rect x="844" y="232.60000000000002" width="156.0" height="8" rx="4" fill="#e2d6c9"/><rect x="844" y="316" width="145.0" height="31" rx="15.5" fill="#18181b"/><text x="858" y="334.0" font-size="15" font-weight="700" fill="#fff" text-anchor="start">回应招标需求 3.2</text><text x="600.0" y="428.0" font-size="19" font-weight="400" fill="#71717a" text-anchor="middle">AI 无法凭空编造证据。给它真实数字，主张和证据就会出现在同一页。</text></svg>
