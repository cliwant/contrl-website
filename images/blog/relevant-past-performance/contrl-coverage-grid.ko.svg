<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="수행 실적 커버리지 표. 행은 Contrl이 제안요청서에서 추출한 요구사항 다섯 개로, 각각 출처 조항이 붙어 있다. 열은 팀이 고른 후보 사업 세 개다. 주황색 점은 각 사업이 어떤 요구사항을 다루는지 표시하고, 수행사 전환 요구사항에는 점이 없어 컨소시엄 파트너의 실적이나 수행 방안 설명으로 메워야 할 공백으로 표시된다" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>수행 실적 커버리지 표. 행은 Contrl이 제안요청서에서 추출한 요구사항 다섯 개로, 각각 출처 조항이 붙어 있다. 열은 팀이 고른 후보 사업 세 개다. 주황색 점은 각 사업이 어떤 요구사항을 다루는지 표시하고, 수행사 전환 요구사항에는 점이 없어 컨소시엄 파트너의 실적이나 수행 방안 설명으로 메워야 할 공백으로 표시된다</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="610" fill="#fff"/><text x="40" y="50.0" font-size="22" font-weight="800" fill="#18181b" text-anchor="start">무엇을 누가 증명하나: 행은 제안요청서에서, 체크는 우리 실적에서</text><rect x="30" y="86" width="570" height="456" rx="16" fill="#f9f6f2" stroke="#F27A2E" stroke-width="2"/><rect x="50" y="102" width="142.6" height="31" rx="15.5" fill="#F27A2E"/><text x="64" y="120.0" font-size="15" font-weight="700" fill="#fff" text-anchor="start">행 · Contrl에서</text><text x="50" y="166.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="start">제안요청서에서 추출한 요구사항</text><text x="650" y="116.0" font-size="17" font-weight="800" fill="#18181b" text-anchor="start">열 · 우리 팀</text><text x="650" y="144.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="start">후보 사업</text><rect x="50" y="218" width="530" height="50" rx="10" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="68" y="248.0" font-size="14" font-weight="800" fill="#b7551b" text-anchor="start">과업 3.1</text><text x="143.2" y="249.0" font-size="17" font-weight="600" fill