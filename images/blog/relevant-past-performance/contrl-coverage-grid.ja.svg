<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="過去実績のカバレッジ表。行はContrlがRFPから抽出した五つの要件で、それぞれ出典の条項番号が付いている。列はチームが選んだ三つの候補案件。オレンジの点は各案件がどの要件をカバーするかを示し、現行業者からの移行の要件には点がなく、協力会社の実績か説明した実施方法で埋めるべき空白として示されている" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><title>過去実績のカバレッジ表。行はContrlがRFPから抽出した五つの要件で、それぞれ出典の条項番号が付いている。列はチームが選んだ三つの候補案件。オレンジの点は各案件がどの要件をカバーするかを示し、現行業者からの移行の要件には点がなく、協力会社の実績か説明した実施方法で埋めるべき空白として示されている</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="610" fill="#fff"/><text x="40" y="50.0" font-size="22" font-weight="800" fill="#18181b" text-anchor="start">どの実績が何を証明するか：行はRFPから、チェックは自社の記録から</text><rect x="30" y="86" width="570" height="456" rx="16" fill="#f9f6f2" stroke="#F27A2E" stroke-width="2"/><rect x="50" y="102" width="127.6" height="31" rx="15.5" fill="#F27A2E"/><text x="64" y="120.0" font-size="15" font-weight="700" fill="#fff" text-anchor="start">行 · Contrlで</text><text x="50" y="166.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="start">RFPから抽出した要件</text><text x="650" y="116.0" font-size="17" font-weight="800" fill="#18181b" text-anchor="start">列 · 自社チーム</text><text x="650" y="144.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="start">候補案件</text><rect x="50" y="218" width="530" height="50" rx="10" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="68" y="248.0" font-size="14" font-weight="800" fill="#b7551b" text-anchor="start">SOW 3.1</text><text x="146.28" y="249.0" font-size="17" font-weight="600" fill="#18181b" text-anchor="start">24時間サービスデスク</text><line x