<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="一枚のページが二つに分かれる。評価者が見るスライドには便益を示す見出しと図、発表者が話すスピーカーノートにはセクションのキーセンテンスが入り、どちらもウィンテーマから生まれ.pptxで書き出される" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><title>一枚のページが二つに分かれる。評価者が見るスライドには便益を示す見出しと図、発表者が話すスピーカーノートにはセクションのキーセンテンスが入り、どちらもウィンテーマから生まれ.pptxで書き出される</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="560" fill="#fff"/><text x="40" y="50.0" font-size="18" font-weight="700" fill="#71717a" text-anchor="start">評価者が見るもの</text><text x="720" y="50.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">発表者が話すこと</text><rect x="40" y="70" width="560" height="330" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="68" y="116.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="start">第3章 · システム移行</text><text x="68" y="154.0" font-size="26" font-weight="700" fill="#18181b" text-anchor="start">移行中も</text><text x="68" y="187.8" font-size="26" font-weight="700" fill="#18181b" text-anchor="start">サービスは止まりません</text><circle cx="140" cy="300" r="34" fill="#F27A2E" stroke="#F27A2E" stroke-width="2"/><text x="140" y="306.0" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="140" y="362.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="middle">拠点1</text><line x1="180" y1="300" x2="278" y2="300" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><circle cx="320" cy="300" r="34" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="320" y="306.0" font-size="22" font-weight="700" fill="#b7551b" text-anchor="middle">2</text><text x="320" y="362.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="middle">拠点2</text><line x1="360" y1="300" x2="458" y2="300" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><circle cx="500" cy="300" r="34" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="500" y="306.0" font-size="22" font-weight="700" fill="#b7551b" text-anchor="middle">3</text><text x="500" y="362.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="middle">拠点3</text><rect x="442.64" y="96" width="137.36" height="28" rx="14" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="511.31999999999994" y="115.0" font-size="13" font-weight="600" fill="#71717a" text-anchor="middle">RFP要件3.2に対応</text><line x1="604" y1="235" x2="716" y2="235" stroke="#F27A2E" stroke-width="2" stroke-dasharray="5 5"/><rect x="605.0" y="200" width="110" height="24" rx="12" fill="#fff" stroke="#F27A2E" stroke-width="1.5"/><text x="660" y="216.0" font-size="12" font-weight="700" fill="#b7551b" text-anchor="middle">一つのメッセージ</text><rect x="720" y="70" width="440" height="330" rx="14" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="744" y="110.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">スピーカーノート</text><rect x="744" y="132" width="392" height="2" rx="1" fill="#e2d6c9"/><text x="744" y="166.0" font-size="15" font-weight="700" fill="#b7551b" text-anchor="start">キーセンテンス · 最初に話す</text><rect x="744" y="180" width="6" height="118" rx="3" fill="#F27A2E"/><text x="764" y="210.0" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">「一拠点ずつ順に移行するため、</text><text x="764" y="236.6" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">稼働中のサービスは一つも</text><text x="764" y="263.2" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">止まりません」</text><text x="744" y="328.0" font-size="16" font-weight="400" fill="#71717a" text-anchor="start">続いて3つの段階と切り戻し計画を説明する。</text><rect x="744" y="346.4" width="392" height="7" rx="3" fill="#e2d6c9"/><rect x="744" y="364.4" width="235.2" height="7" rx="3" fill="#e2d6c9"/><rect x="254.39999999999998" y="440" width="132" height="40" rx="20" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="320.4" y="466.0" font-size="16" font-weight="700" fill="#18181b" text-anchor="middle">ウィンテーマ</text><line x1="392.4" y1="460" x2="434.4" y2="460" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="442.4" y="440" width="148" height="40" rx="20" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="516.4" y="466.0" font-size="16" font-weight="700" fill="#18181b" text-anchor="middle">キーセンテンス</text><line x1="596.4" y1="460" x2="638.4" y2="460" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="646.4" y="440" width="164" height="40" rx="20" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="728.4" y="466.0" font-size="16" font-weight="700" fill="#18181b" text-anchor="middle">スライド＋ノート</text><line x1="816.4" y1="460" x2="858.4" y2="460" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="866.4" y="440" width="79.19999999999999" height="40" rx="20" fill="#18181b"/><text x="906.0" y="466.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">.pptx</text><text x="600.0" y="526.0" font-size="17" font-weight="400" fill="#71717a" text-anchor="middle">スライドは軽く、論理のすべてはノートに。どちらも自社のデザインシステムで。</text></svg>
