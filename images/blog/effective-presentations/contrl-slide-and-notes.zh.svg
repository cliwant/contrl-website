<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="同一页分成两部分：评审专家看到的幻灯片上是体现收益的标题和图示，演讲者备注里是演讲者首先要说的章节核心句；两者都来自制胜主题，并导出为 .pptx" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><title>同一页分成两部分：评审专家看到的幻灯片上是体现收益的标题和图示，演讲者备注里是演讲者首先要说的章节核心句；两者都来自制胜主题，并导出为 .pptx</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="560" fill="#fff"/><text x="40" y="50.0" font-size="18" font-weight="700" fill="#71717a" text-anchor="start">评审专家看到的</text><text x="720" y="50.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">演讲者说出的</text><rect x="40" y="70" width="560" height="330" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="68" y="116.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="start">第3章 · 系统切换</text><text x="68" y="154.0" font-size="26" font-weight="700" fill="#18181b" text-anchor="start">切换期间</text><text x="68" y="187.8" font-size="26" font-weight="700" fill="#18181b" text-anchor="start">服务不中断</text><circle cx="140" cy="300" r="34" fill="#F27A2E" stroke="#F27A2E" stroke-width="2"/><text x="140" y="306.0" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="140" y="362.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="middle">站点1</text><line x1="180" y1="300" x2="278" y2="300" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><circle cx="320" cy="300" r="34" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="320" y="306.0" font-size="22" font-weight="700" fill="#b7551b" text-anchor="middle">2</text><text x="320" y="362.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="middle">站点2</text><line x1="360" y1="300" x2="458" y2="300" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><circle cx="500" cy="300" r="34" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="500" y="306.0" font-size="22" font-weight="700" fill="#b7551b" text-anchor="middle">3</text><text x="500" y="362.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="middle">站点3</text><rect x="454.6" y="96" width="125.4" height="28" rx="14" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="517.3" y="115.0" font-size="13" font-weight="600" fill="#71717a" text-anchor="middle">回应招标需求 3.2</text><line x1="604" y1="235" x2="716" y2="235" stroke="#F27A2E" stroke-width="2" stroke-dasharray="5 5"/><rect x="623.0" y="200" width="74" height="24" rx="12" fill="#fff" stroke="#F27A2E" stroke-width="1.5"/><text x="660" y="216.0" font-size="12" font-weight="700" fill="#b7551b" text-anchor="middle">同一个信息</text><rect x="720" y="70" width="440" height="330" rx="14" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="744" y="110.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">演讲者备注</text><rect x="744" y="132" width="392" height="2" rx="1" fill="#e2d6c9"/><text x="744" y="166.0" font-size="15" font-weight="700" fill="#b7551b" text-anchor="start">核心句 · 第一句就说</text><rect x="744" y="180" width="6" height="118" rx="3" fill="#F27A2E"/><text x="764" y="210.0" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">“我们一次只切换一个站点，</text><text x="764" y="236.6" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">所以您运行中的服务</text><text x="764" y="263.2" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">一项都不会中断。”</text><text x="744" y="328.0" font-size="16" font-weight="400" fill="#71717a" text-anchor="start">接着讲三个步骤和回退方案。</text><rect x="744" y="346.4" width="392" height="7" rx="3" fill="#e2d6c9"/><rect x="744" y="364.4" width="235.2" h