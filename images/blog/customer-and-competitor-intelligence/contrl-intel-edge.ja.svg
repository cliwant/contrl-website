<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" width="1200" height="598" role="img" aria-label="RFPだけでは誰でも書ける草案になり、チームのインテリジェンスを加えると競合が言えない強みを持つウィンテーマになる" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><title>RFPだけでは誰でも書ける草案になり、チームのインテリジェンスを加えると競合が言えない強みを持つウィンテーマになる</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="598" fill="#fff"/><text x="40" y="52.0" font-size="18" font-weight="700" fill="#71717a" text-anchor="start">RFPだけ</text><rect x="40" y="70" width="300" height="100" rx="14" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="64" y="112.0" font-size="22" font-weight="700" fill="#18181b" text-anchor="start">RFP</text><text x="64" y="146.0" font-size="16" font-weight="400" fill="#71717a" text-anchor="start">要求事項、評価基準</text><line x1="344" y1="120" x2="426" y2="120" stroke="#a1a1aa" stroke-width="3" marker-end="url(#ah-a1a1aa)"/><rect x="430" y="80" width="270" height="80" rx="14" fill="#f4f4f5"/><text x="565" y="128.0" font-size="19" font-weight="700" fill="#52525b" text-anchor="middle">AIで草案作成</text><line x1="704" y1="120" x2="778" y2="120" stroke="#a1a1aa" stroke-width="3" marker-end="url(#ah-a1a1aa)"/><rect x="782" y="70" width="378" height="100" rx="14" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="6 6"/><text x="806" y="113.3" font-size="19" font-weight="600" fill="#52525b" text-anchor="start">要件は満たしているが、どの会社が書</text><text x="806" y="139.0" font-size="19" font-weight="600" fill="#52525b" text-anchor="start">いても同じ草案</text><line x1="40" y1="212" x2="1160" y2="212" stroke="#e2d6c9" stroke-width="2"/><text x="40" y="258.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">RFP + 自社チームのインテリジェンス</text><rect x="40" y="276" width="300" height="100" rx="14" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="64" y="318.0" font-size="22" font-weight="700" fill="#18181b" text-anchor="start">RFP</text><text x="64" y="352.0" font-size="16" font-weight="400" fill="#71717a" text-anchor="start">要求事項、評価基準</text><rect x="40" y="392" width="300" height="174.3" rx="14" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="64" y="428.0" font-size="20" font-weight="700" fill="#b7551b" text-anchor="start">自社チームだけが知ること</text><circle cx="70" cy="462.0" r="4" fill="#F27A2E"/><text x="84" y="468.0" font-size="17" font-weight="400" fill="#18181b" text-anchor="start">顧客が懸念していること</text><circle cx="70" cy="494.1" r="4" fill="#F27A2E"/><text x="84" y="500.1" font-size="17" font-weight="400" fill="#18181b" text-anchor="start">競合ごとの弱点</text><circle cx="70" cy="526.2" r="4" fill="#F27A2E"/><text x="84" y="532.2" font-size="17" font-weight="400" fill="#18181b" text-anchor="start">この顧客との実績</text><path d="M344 326 C392 326 392 416.15 426 416.15" fill="none" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><path d="M344 479.15 C392 479.15 392 426.15 426 426.15" fill="none" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="430" y="376.15" width="270" height="90" rx="14" fill="#fff" stroke="#F27A2E" stroke-width="2"/><text x="565" y="426.8" font-size="19" font-weight="700" fill="#18181b" text-anchor="middle">Contrl 戦略インタビュー</text><line x1="704" y1="421.15" x2="778" y2="421.15" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="782" y="358.15" width="378" height="126" rx="14" fill="#18181b"/><text x="806" y="414.1" font-size="20" font-weight="700" fill="#fff" text-anchor="start">競合には言えない強みを持つ</text><text x="806" y="441.1" font-size="20" font-weight="700" fill="#fff" text-anchor="start">ウィンテーマ</text></svg>
