<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" width="1200" height="598" role="img" aria-label="제안요청서만 넣으면 누구나 쓸 수 있는 초안이 나오고, 팀의 인텔리전스를 더하면 경쟁사가 말할 수 없는 강점을 담은 윈 테마가 나온다" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>제안요청서만 넣으면 누구나 쓸 수 있는 초안이 나오고, 팀의 인텔리전스를 더하면 경쟁사가 말할 수 없는 강점을 담은 윈 테마가 나온다</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="598" fill="#fff"/><text x="40" y="52.0" font-size="18" font-weight="700" fill="#71717a" text-anchor="start">제안요청서만</text><rect x="40" y="70" width="300" height="100" rx="14" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="64" y="112.0" font-size="22" font-weight="700" fill="#18181b" text-anchor="start">제안요청서</text><text x="64" y="146.0" font-size="16" font-weight="400" fill="#71717a" text-anchor="start">요구사항, 평가 기준</text><line x1="344" y1="120" x2="426" y2="120" stroke="#a1a1aa" stroke-width="3" marker-end="url(#ah-a1a1aa)"/><rect x="430" y="80" width="270" height="80" rx="14" fill="#f4f4f5"/><text x="565" y="128.0" font-size="19" font-weight="700" fill="#52525b" text-anchor="middle">AI 초안 작성</text><line x1="704" y1="120" x2="778" y2="120" stroke="#a1a1aa" stroke-width="3" marker-end="url(#ah-a1a1aa)"/><rect x="782" y="70" width="378" height="100" rx="14" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="6 6"/><text x="806" y="113.3" font-size="19" font-weight="600" fill="#52525b" text-anchor="start">요구사항은 다 맞췄지만 어느 회사가</text><text x="806" y="139.0" font-size="19" font-weight="600" fill="#52525b" text-anchor="start">써도 같은 초안</text><line x1="40" y1="212" x2="1160" y2="212" stroke="#e2d6c9" st