<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Contrl 전략 인터뷰에서 말한 기능이 고객·경쟁사 정보와 함께 고객 니즈, 우리의 강점(왜 우리인가), 효과(그래서 뭐가 좋은가)를 담은 윈 테마가 된다" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>Contrl 전략 인터뷰에서 말한 기능이 고객·경쟁사 정보와 함께 고객 니즈, 우리의 강점(왜 우리인가), 효과(그래서 뭐가 좋은가)를 담은 윈 테마가 된다</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="560" fill="#fff"/><rect x="30" y="30" width="410" height="450" rx="16" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="56" y="70.0" font-size="19" font-weight="700" fill="#71717a" text-anchor="start">인터뷰에서 우리가 말하는 것</text><rect x="56" y="96" width="358" height="112" rx="12" fill="#fff" stroke="#F27A2E" stroke-width="2"/><text x="78" y="130.0" font-size="15" font-weight="700" fill="#b7551b" text-anchor="start">기능 · 우리가 가진 것</text><text x="78" y="166.0" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">24시간 관제 센터</text><rect x="56" y="222" width="358" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="78" y="256.0" font-size="15" font-weight="700" fill="#71717a" text-anchor="start">고객</text><text x="78" y="292.0" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">작년에 장애를 늦게 발견했다</text><rect x="56" y="348" width="358" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="78" y="382.0" font-size="15" font-weight="700" fill="#71717a" text-anchor="start">경쟁사</text><text x="78" y="418.0" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">B사는 업무 시간에만 관제한다</text><path d="M442 255 L486 255" fill="none" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="490" y="195" width="170" height="120" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="575" y="247.8" font-size="18" font-weight="700" fill="#18181b" text-anchor="middle">Contrl 전략</text><text x="575" y="273.0" font-size="18" font-weight="700" fill="#18181b" text-anchor="middle">인터뷰</text><line x1="662" y1="255" x2="700" y2="255" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="704" y="30" width="466" height="450" rx="16" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="732" y="74.0" font-size="22" font-weight="700" fill="#b7551b" text-anchor="start">윈 테마</text><rect x="728" y="100" width="418" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="750" y="134.0" font-size="16" font-weight="700" fill="#71717a" text-anchor="start">고객 니즈</text><text x="750" y="174.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">사용자보다 먼저 문제를 발견</text><rect x="728" y="226" width="418" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="750" y="260.0" font-size="16" font-weight="700" fill="#71717a" text-anchor="start">우리의 강점</text><rect x="1019.4" y="240" width="110.60000000000001" height="30" rx="15.0" fill="#F27A2E"/><text x="1033.4" y="257.0" font-size="14" font-weight="700" fill="#fff" text-anchor="start">왜 우리인가?</text><text x="750" y="300.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">유일한 24시간 관제</text><rect x="728" y="352" width="418" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="750" y="386.0" font-size="16" font-weight="700" fill="#71717a" text-anchor="start">효과</text><rect x="1051.6" y="366" width="78.4" height="30" rx="15.0" fill="#F27A2E"/><text x="1065.6" y="383.0" font-size="14" font-weight="700" fill="#fff" text-anchor="start">그래서?</text><text x="750" y="426.0" font-size="20" font-weight="700" fill="#18181b" tex