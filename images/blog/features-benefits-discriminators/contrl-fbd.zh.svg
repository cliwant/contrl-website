<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="在 Contrl 策略访谈中提到的功能，加上对客户和竞争对手的了解，会变成写明客户需求、我方优势（为什么是我们）和收益（那又怎样）的制胜主题" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><title>在 Contrl 策略访谈中提到的功能，加上对客户和竞争对手的了解，会变成写明客户需求、我方优势（为什么是我们）和收益（那又怎样）的制胜主题</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="560" fill="#fff"/><rect x="30" y="30" width="410" height="450" rx="16" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="56" y="70.0" font-size="19" font-weight="700" fill="#71717a" text-anchor="start">你在访谈中提供的信息</text><rect x="56" y="96" width="358" height="112" rx="12" fill="#fff" stroke="#F27A2E" stroke-width="2"/><text x="78" y="130.0" font-size="15" font-weight="700" fill="#b7551b" text-anchor="start">功能 · 我们拥有的</text><text x="78" y="166.0" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">7×24 小时监控中心</text><rect x="56" y="222" width="358" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="78" y="256.0" font-size="15" font-weight="700" fill="#71717a" text-anchor="start">客户</text><text x="78" y="292.0" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">去年故障发现得太晚</text><rect x="56" y="348" width="358" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="78" y="382.0" font-size="15" font-weight="700" fill="#71717a" text-anchor="start">竞争对手</text><text x="78" y="418.0" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">B 公司只在工作时间监控</text><path d="M442 255 L486 255" fill="none" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="490" y="195" width="170" height="120" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="575" y="247.8" font-size="18" font-weight="700" fill="#18181b" text-anchor="middle">Contrl</text><text x="575" y="273.0" font-size="18" font-weight="700" fill="#18181b" text-anchor="middle">策略访谈</text><line x1="662" y1="255" x2="700" y2="255" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="704" y="30" width="466" height="450" rx="16" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="732" y="74.0" font-size="22" font-weight="700" fill="#b7551b" text-anchor="start">制胜主题</text><rect x="728" y="100" width="418" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="750" y="134.0" font-size="16" font-weight="700" fill="#71717a" text-anchor="start">客户需求</text><text x="750" y="174.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">在用户察觉之前发现问题</text><rect x="728" y="226" width="418" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="750" y="260.0" font-size="16" font-weight="700" fill="#71717a" text-anchor="start">我方优势</text><rect x="1004" y="240" width="126" height="30" rx="15.0" fill="#F27A2E"/><text x="1018" y="257.0" font-size="14" font-weight="700" fill="#fff" text-anchor="start">为什么是我们？</text><text x="750" y="300.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">唯一的全天候监控</text><rect x="728" y="352" width="418" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="750" y="386.0" font-size="16" font-weight="700" fill="#71717a" text-anchor="start">收益</text><rect x="1032" y="366" width="98" height="30" rx="15.0" fill="#F27A2E"/><text x="1046" y="383.0" font-size="14" font-weight="700" fill="#fff" text-anchor="start">那又怎样？</text><text x="750" y="426.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">缩短服务中断时间</text><text x="600.0" y="524.0" font-size="18" font-weight="400" fill="#71717a" text-anchor="middle">输入的是功能，制胜主题说出的是需求、优势和收益。</text></svg>
