<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Contrl에서 한 섹션이 거친 단계에서 완성으로 가는 과정: 먼저 핵심 문장 후보 셋 중 하나를 고르고, 섹션 전개안 셋 중 하나를 고른 뒤에야 Contrl이 회사 디자인 시스템으로 슬라이드를 그리며, 페이지마다 대응하는 제안요청서 요구사항을 밝힌다" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>Contrl에서 한 섹션이 거친 단계에서 완성으로 가는 과정: 먼저 핵심 문장 후보 셋 중 하나를 고르고, 섹션 전개안 셋 중 하나를 고른 뒤에야 Contrl이 회사 디자인 시스템으로 슬라이드를 그리며, 페이지마다 대응하는 제안요청서 요구사항을 밝힌다</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="560" fill="#fff"/><circle cx="55" cy="42" r="15" fill="#F27A2E"/><text x="55" y="48.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="82" y="49.0" font-size="21" font-weight="800" fill="#18181b" text-anchor="start">문장</text><text x="40" y="86.0" font-size="15" font-weight="400" fill="#71717a" text-anchor="start">핵심 문장 후보 3개 중 선택</text><circle cx="450" cy="42" r="15" fill="#F27A2E"/><text x="450" y="48.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="477" y="49.0" font-size="21" font-weight="800" fill="#18181b" text-anchor="start">전개</text><text x="435" y="86.0" font-size="15" font-weight="400" fill="#71717a" text-anchor="start">전개안 3개 중 선택</text><circle cx="845" cy="42" r="15" fill="#F27A2E"/><text x="845" y="48.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="872" y="49.0" font-size="21" font-weight="800" fill="#b7551b" text-anchor="start">페이지</text><text x="830" y="86.0" font-size="15" font-weight="400" fill="#71717a" text-anchor="start">Contrl이 슬라이드 작성</text><line x1="384" y1="271.0" x2="411" y2="271.0" stroke="#F27A2E" stroke-width="2.5"/><path d="M409 263.0 L421 271.0 L409 279.0 Z" fill="#F27A2E"/><line x1="779" y1="271.0" x2="806" y2="271.0" stroke="#F27A2E" stroke-width="2.5"/><path d="M804 263.0 L816 271.0 L804 279.0 Z" fill="#F27A2E"/><rect x="40" y="112" width="330" height="318" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><rect x="58" y="158.4" width="294" height="62" rx="10" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1" stroke-dasharray="5 5"/><rect x="76" y="178.4" width="219.29999999999998" height="8" rx="4" fill="#f4f4f5"/><rect x="76" y="194.4" width="141.9" height="8" rx="4" fill="#f4f4f5"/><rect x="58" y="234.4" width="294" height="73.2" rx="10" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><circle cx="78" cy="258.4" r="10" fill="#F27A2E"/><path d="M73 258.4 l4 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="263.4" font-size="16" font-weight="700" fill="#18181b" text-anchor="start">새 시스템이 안정될 때까지 승객은</text><text x="98" y="285.0" font-size="16" font-weight="700" fill="#18181b" text-anchor="start">지금 방식 그대로 요금을 냅니다</text><rect x="58" y="321.6" width="294" height="62" rx="10" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1" stroke-dasharray="5 5"/><rect x="76" y="341.6" width="219.29999999999998" height="8" rx="4" fill="#f4f4f5"/><rect x="76" y="357.6" width="141.9" height="8" rx="4" fill="#f4f4f5"/><rect x="435" y="112" width="330" height="318" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><rect x="453.0" y="132" width="92.66666666666667" height="34" rx="8" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1"/><text x="499.3333333333333" y="155.0" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">전개안 A</text><rect x="553.6666666666666" y="132" width="92.66666666666667" height="34" rx="8" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="600.0" y="155.0" font-size="14" font-weight="700" fill="#b7551b" text-anc