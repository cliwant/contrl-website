<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="A proposal page read the way an evaluator reads it, with a doubt in the margin beside each claim. Two doubts are already answered on the page; the third is open, and one line of chat feedback adds its answer" font-family="'Pretendard', -apple-system, 'Helvetica Neue', Arial, sans-serif"><title>A proposal page read the way an evaluator reads it, with a doubt in the margin beside each claim. Two doubts are already answered on the page; the third is open, and one line of chat feedback adds its answer</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="590" fill="#fff"/><text x="40" y="46.0" font-size="18" font-weight="700" fill="#71717a" text-anchor="start">The page</text><text x="770" y="46.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">What the evaluator is thinking</text><rect x="40" y="64" width="640" height="370" rx="6" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><path d="M646 64L680 98L646 98z" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="68" y="110.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">We are a small company.</text><rect x="68" y="126" width="584" height="44" rx="8" fill="#f9f6f2"/><rect x="68" y="126" width="5" height="44" rx="2" fill="#F27A2E"/><text x="86" y="154.0" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">Our references: major companies</text><line x1="684" y1="130.0" x2="756" y2="130.0" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="3 6"/><rect x="770" y="90" width="390" height="80" rx="18" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><path d="M771 121.0L757 130.0L771 139.0" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="792" y="124.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">A company this small?</text><circle cx="803" cy="146" r="11" fill="#F27A2E"/><path d="M798 146l4 4l7 -8" fill="none" stroke="#fff" stroke-width="2.4"/><text x="822" y="152.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="start">answered</text><text x="68" y="226.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">It will work in your setting.</text><rect x="68" y="242" width="584" height="44" rx="8" fill="#f9f6f2"/><rect x="68" y="242" width="5" height="44" rx="2" fill="#F27A2E"/><text x="86" y="270.0" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">Results from a similar project</text><line x1="684" y1="246.0" x2="756" y2="246.0" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="3 6"/><rect x="770" y="206" width="390" height="80" rx="18" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><path d="M771 237.0L757 246.0L771 255.0" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="792" y="240.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">Says who?</text><circle cx="803" cy="262" r="11" fill="#F27A2E"/><path d="M798 262l4 4l7 -8" fill="none" stroke="#fff" stroke-width="2.4"/><text x="822" y="268.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="start">answered</text><text x="68" y="342.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">It is worth the higher price.</text><rect x="68" y="358" width="584" height="44" rx="8" fill="#fffaf6" stroke="#F27A2E" stroke-width="2" stroke-dasharray="6 5"/><text x="86" y="386.0" font-size="16" font-weight="600" fill="#b7551b" text-anchor="start">Answer still missing</text><line x1="684" y1="362.0" x2="756" y2="362.0" stroke="#F27A2E" stroke-width="2" stroke-dasharray="3 6"/><rect x="770" y="322" width="390" height="80" rx="18" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><path d="M771 353.0L757 362.0L771 371.0" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="792" y="356.0" font-size="20" font-weight="700" fill="#b7551b" text-anchor="start">Why pay more?</text><text x="792" y="384.0" font-size="15" font-weight="700" fill="#b7551b" text-anchor="start">still open</text><rect x="40" y="460" width="640" height="58" rx="29" fill="#18181b"/><rect x="54" y="475" width="197.42" height="28" rx="14" fill="#F27A2E"/><text x="152.70999999999998" y="494.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">One line of chat feedback</text><text x="265.41999999999996" y="496.0" font-size="17" font-weight="600" fill="#fff" text-anchor="start">“Add what this saves them, using our figures.”</text><line x1="620" y1="458" x2="620" y2="406" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><text x="600.0" y="568.0" font-size="17" font-weight="400" fill="#71717a" text-anchor="middle">Read each page as the doubter would. Whatever doubt is left open is your next line of feedback.</text></svg>
