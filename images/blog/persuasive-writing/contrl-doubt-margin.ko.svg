<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="평가위원의 눈으로 읽은 제안서 한 페이지. 주장마다 옆 여백에 의심이 적혀 있다. 두 개는 이미 페이지 안에서 답이 되었고, 세 번째는 비어 있어 채팅 피드백 한 줄로 답을 채운다" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>평가위원의 눈으로 읽은 제안서 한 페이지. 주장마다 옆 여백에 의심이 적혀 있다. 두 개는 이미 페이지 안에서 답이 되었고, 세 번째는 비어 있어 채팅 피드백 한 줄로 답을 채운다</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="590" fill="#fff"/><text x="40" y="46.0" font-size="18" font-weight="700" fill="#71717a" text-anchor="start">페이지</text><text x="770" y="46.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">평가위원의 머릿속</text><rect x="40" y="64" width="640" height="370" rx="6" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><path d="M646 64L680 98L646 98z" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="68" y="110.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">우리는 작은 회사입니다.</text><rect x="68" y="126" width="584" height="44" rx="8" fill="#f9f6f2"/><rect x="68" y="126" width="5" height="44" rx="2" fill="#F27A2E"/><text x="86" y="154.0" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">레퍼런스: 굴지의 기업들</text><line x1="684" y1="130.0" x2="756" y2="130.0" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="3 6"/><rect x="770" y="90" width="390" height="80" rx="18" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><path d="M771 121.0L757 130.0L771 139.0" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="792" y="124.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">이렇게 작은 회사가?</text><circle cx="803" 