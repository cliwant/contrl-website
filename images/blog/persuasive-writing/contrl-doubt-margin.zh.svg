<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="以评审专家的眼光阅读提案书的一页：每条主张旁的页边都写着疑问。两条已在页面上得到回答，第三条仍空缺，用一行聊天反馈补上答案" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><title>以评审专家的眼光阅读提案书的一页：每条主张旁的页边都写着疑问。两条已在页面上得到回答，第三条仍空缺，用一行聊天反馈补上答案</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="590" fill="#fff"/><text x="40" y="46.0" font-size="18" font-weight="700" fill="#71717a" text-anchor="start">这一页</text><text x="770" y="46.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">评审专家心里在想</text><rect x="40" y="64" width="640" height="370" rx="6" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><path d="M646 64L680 98L646 98z" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="68" y="110.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">我们是一家小公司。</text><rect x="68" y="126" width="584" height="44" rx="8" fill="#f9f6f2"/><rect x="68" y="126" width="5" height="44" rx="2" fill="#F27A2E"/><text x="86" y="154.0" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">业绩：知名大企业</text><line x1="684" y1="130.0" x2="756" y2="130.0" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="3 6"/><rect x="770" y="90" width="390" height="80" rx="18" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><path d="M771 121.0L757 130.0L771 139.0" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="792" y="124.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">这么小的公司行吗？</text><circle cx="803" cy="146" r="11" fill="#F27A2E"/><path d="M798 146l4 4l7 -8" fill="none" stroke="#fff" stroke-width="2.4"/><text x="822" y="152.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="start">已回答</text><text x="68" y="226.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">在贵方的环境中同样可行。</text><rect x="68" y="242" width="584" height="44" rx="8" fill="#f9f6f2"/><rect x="68" y="242" width="5" height="44" rx="2" fill="#F27A2E"/><text x="86" y="270.0" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">类似项目的结果</text><line x1="684" y1="246.0" x2="756" y2="246.0" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="3 6"/><rect x="770" y="206" width="390" height="80" rx="18" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><path d="M771 237.0L757 246.0L771 255.0" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="792" y="240.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">谁说的？</text><circle cx="803" cy="262" r="11" fill="#F27A2E"/><path d="M798 262l4 4l7 -8" fill="none" stroke="#fff" stroke-width="2.4"/><text x="822" y="268.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="start">已回答</text><text x="68" y="342.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">更高的价格物有所值。</text><rect x="68" y="358" width="584" height="44" rx="8" fill="#fffaf6" stroke="#F27A2E" stroke-width="2" stroke-dasharray="6 5"/><text x="86" y="386.0" font-size="16" font-weight="600" fill="#b7551b" text-anchor="start">还没有答案</text><line x1="684" y1="362.0" x2="756" y2="362.0" stroke="#F27A2E" stroke-width="2" stroke-dasharray="3 6"/><rect x="770" y="322" width="390" height="80" rx="18" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><path d="M771 353.0L757 362.0L771 371.0" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="792" y="356.0" font-size="20" font-weight="700" fill="#b7551b" text-anchor="start">为什么要多付钱？</text><text x="792" y="384.0" font-size="15" font-weight="700" fill="#b7551b" text-anchor="start">尚未回答</text><rect x="40" y="460" width="640" height="58" rx="29" fill="#18181b"/><rect x="54" y="475" width="102" height="28" rx="14" fill="#F27A2E"/><text x="105.0" y="494.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">一行聊天反馈</text><text x="170" y="496.0" font-size="17" font-weight="600" fill="#fff" text-anchor="start">“用我们的数字写明能省下多少。”</text><line x1="620" y1="458" x2="620" y2="406" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><text x="600.0" y="568.0" font-size="17" font-weight="400" fill="#71717a" text-anchor="middle">用怀疑者的眼光读每一页。还没回答的疑问，就是下一条反馈。</text></svg>
