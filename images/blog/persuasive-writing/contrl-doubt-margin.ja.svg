<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="評価者の目で読んだ提案書の一ページ。主張ごとに余白に疑問が書かれている。二つはすでにページ内で答えがあり、三つ目は空いていて、チャットのフィードバック一行で答えを加える" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><title>評価者の目で読んだ提案書の一ページ。主張ごとに余白に疑問が書かれている。二つはすでにページ内で答えがあり、三つ目は空いていて、チャットのフィードバック一行で答えを加える</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="590" fill="#fff"/><text x="40" y="46.0" font-size="18" font-weight="700" fill="#71717a" text-anchor="start">ページ</text><text x="770" y="46.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">評価者の頭の中</text><rect x="40" y="64" width="640" height="370" rx="6" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><path d="M646 64L680 98L646 98z" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="68" y="110.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">当社は小さな会社です。</text><rect x="68" y="126" width="584" height="44" rx="8" fill="#f9f6f2"/><rect x="68" y="126" width="5" height="44" rx="2" fill="#F27A2E"/><text x="86" y="154.0" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">実績：有力企業との仕事</text><line x1="684" y1="130.0" x2="756" y2="130.0" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="3 6"/><rect x="770" y="90" width="390" height="80" rx="18" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><path d="M771 121.0L757 130.0L771 139.0" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="792" y="124.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">こんなに小さな会社で？</text><circle cx="803" cy="146" r="11" fill="#F27A2E"/><path d="M798 146l4 4l7 -8" fill="none" stroke="#fff" stroke-width="2.4"/><text x="822" y="152.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="start">回答済み</text><text x="68" y="226.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">貴社の環境でも機能します。</text><rect x="68" y="242" width="584" height="44" rx="8" fill="#f9f6f2"/><rect x="68" y="242" width="5" height="44" rx="2" fill="#F27A2E"/><text x="86" y="270.0" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">類似案件の結果</text><line x1="684" y1="246.0" x2="756" y2="246.0" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="3 6"/><rect x="770" y="206" width="390" height="80" rx="18" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><path d="M771 237.0L757 246.0L771 255.0" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="792" y="240.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">誰がそう言っている？</text><circle cx="803" cy="262" r="11" fill="#F27A2E"/><path d="M798 262l4 4l7 -8" fill="none" stroke="#fff" stroke-width="2.4"/><text x="822" y="268.0" font-size="15" font-weight="600" fill="#71717a" text-anchor="start">回答済み</text><text x="68" y="342.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">高い金額に見合う価値があります。</text><rect x="68" y="358" width="584" height="44" rx="8" fill="#fffaf6" stroke="#F27A2E" stroke-width="2" stroke-dasharray="6 5"/><text x="86" y="386.0" font-size="16" font-weight="600" fill="#b7551b" text-anchor="start">答えがまだない</text><line x1="684" y1="362.0" x2="756" y2="362.0" stroke="#F27A2E" stroke-width="2" stroke-dasharray="3 6"/><rect x="770" y="322" width="390" height="80" rx="18" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><path d="M771 353.0L757 362.0L771 371.0" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="792" y="356.0" font-size="20" font-weight="700" fill="#b7551b" text-anchor="start">なぜ高く払うのか？</text><text x="792" y="384.0" font-size="15" font-weight="700" fill="#b7551b" text-anchor="start">未回答</text><rect x="40" y="460" width="640" height="58" rx="29" fill="#18181b"/><rect x="54" y="475" width="206" height="28" rx="14" fill="#F27A2E"/><text x="157.0" y="494.0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">チャットのフィードバック一行</text><text x="274" y="496.0" font-size="17" font-weight="600" fill="#fff" text-anchor="start">「削減効果を当社の数字で入れてください」</text><line x1="620" y1="458" x2="620" y2="406" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><text x="600.0" y="568.0" font-size="17" font-weight="400" fill="#71717a" text-anchor="middle">疑う人の目でページを読みましょう。残った疑問が、次のフィードバックです。</text></svg>
