<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550" role="img" aria-label="하나의 윈 테마가 기술 섹션과 가격 설명 페이지를 함께 이끌고, 각 페이지는 대응하는 제안요청서 요구사항을 표시하며, 숫자는 가격 담당 팀이 채운다" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>하나의 윈 테마가 기술 섹션과 가격 설명 페이지를 함께 이끌고, 각 페이지는 대응하는 제안요청서 요구사항을 표시하며, 숫자는 가격 담당 팀이 채운다</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="550" fill="#fff"/><rect x="300" y="26" width="600" height="122" rx="14" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><rect x="324" y="42" width="127.0" height="31" rx="15.5" fill="#F27A2E"/><text x="338" y="60.0" font-size="15" font-weight="700" fill="#fff" text-anchor="start">선택한 윈 테마</text><text x="324" y="100.0" font-size="19" font-weight="600" fill="#18181b" text-anchor="start">단계적 전환으로 전환 기간에도 서비스 중단 없음</text><path d="M 520 148 C 520 176, 280 168, 280 200" fill="none" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><path d="M 680 148 C 680 176, 720 168, 720 200" fill="none" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><text x="60" y="210.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">기술 섹션</text><rect x="60" y="222" width="440" height="250" rx="14" fill="#fff" stroke="#F27A2E" stroke-width="2"/><text x="84" y="266.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">단계적 전환으로 모든 서비스가 멈추지</text><text x="84" y="295.4" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">않습니다</text><rect x="84" y="418" width="229.0" height="31" rx="15.5" fill="#18181b"/><text x="98" y="436.0" font-size="15" font-weight="700" fill="#fff" text-anchor="start">제안요청서 요구사항 2.1 대응</text><rect x="84" y="328.8" width="340" height="8" rx="4" fill="#e2d6c9"/><rect x="84" y="348.8" width="340" height="8" rx="4" fill="#e2d6c9"/><rect x="84" y="368.8" width="204.0" height="8" rx="4" fill="#e2d6c9"/><text x="540" y="210.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">가격 설명 페이지</text><rect x="540" y="222" width="360" height="250" rx="14" fill="#fff" stroke="#F27A2E" stroke-width="2"/><text x="564" y="266.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">단계적 계획이 서비스 중단</text><text x="564" y="295.4" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">비용을 막습니다</text><rect x="564" y="418" width="229.0" height="31" rx="15.5" fill="#18181b"/><text x="578" y="436.0" font-size="15" font-weight="700" fill="#fff" text-anchor="start">제안요청서 요구사항 5.3 대응</text><rect x="564" y="328.8" width="312" height="66" rx="10" fill="#f9f6f2" stroke="#F27A2E" stroke-width="1.5" stroke-dasharray="6 5"/><text x="584" y="354.8" font-size="15" font-weight="700" fill="#b7551b" text-anchor="start">숫자</text><rect x="700" y="366.8" width="22" height="18" rx="3" fill="#d4d4d8"/><rect x="736" y="354.8" width="22" height="30" rx="3" fill="#d4d4d8"/><rect x="772" y="360.8" width="22" height="24" rx="3" fill="#d4d4d8"/><rect x="808" y="344.8" width="22" height="40" rx="3" fill="#F27A2E"/><rect x="940" y="248" width="220" height="160" rx="14" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/><text x="960" y="286.0" font-size="18" font-weight="700" fill="#3f3f46" text-anchor="start">가격 담당 팀</text><text x="960" y="324.0" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">숫자를 채웁니다.</text><text x="960" y="347.2" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Contrl은 가격을</text><text x="960" y="370.4" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">정하지 않습니다.</text><line x1="936" y1="361.8" x2="882" y2="361.8" stroke="#a1a1aa" stroke-width="3" marker-end="url(#ah-a1a1aa)"/><text x="600.0" y="524.0" font-size="19" font-weight="400" fill="#71717a" text-anchor="middle">두 권에 같은 테마. 이야기는 Contrl이, 숫자는 우리 팀이 만듭니다.</text></svg>
