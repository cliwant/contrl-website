<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Contrl 슬라이드 한 장의 윗부분 해부: 장 번호와 제목은 제안요청서가 정한 목차를 따라 평가위원이 찾을 수 있고, 헤드라인은 윈 테마에서 나온 효과를 말하며, 표시는 이 페이지가 답하는 제안요청서 요구사항을 밝힌다" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>Contrl 슬라이드 한 장의 윗부분 해부: 장 번호와 제목은 제안요청서가 정한 목차를 따라 평가위원이 찾을 수 있고, 헤드라인은 윈 테마에서 나온 효과를 말하며, 표시는 이 페이지가 답하는 제안요청서 요구사항을 밝힌다</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="600" fill="#fff"/><text x="40" y="50.0" font-size="18" font-weight="700" fill="#71717a" text-anchor="start">슬라이드 한 장의 윗부분</text><text x="800" y="50.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">각 부분이 하는 일</text><rect x="40" y="74" width="660" height="440" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><rect x="64" y="102" width="180.0" height="44" rx="10" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="80" y="131.0" font-size="20" font-weight="700" fill="#71717a" text-anchor="start">2.3  데이터 이관</text><rect x="64" y="178" width="6" height="92" rx="3" fill="#F27A2E"/><text x="86" y="212.0" font-size="30" font-weight="800" fill="#18181b" text-anchor="start">모든 데이터를 두 번 검증한 뒤</text><text x="86" y="251.0" font-size="30" font-weight="800" fill="#18181b" text-anchor="start">전환합니다</text><rect x="86" y="296" width="278.6" height="32" rx="16" fill="#fffaf6" stroke="#F27A2E" stroke-width="1.5"/><text x="225.3" y="317.0" font-size="14" font-weight="700" fill="#b7551b" text-anchor="middle">제안요청서 요구사항 2.3-1, 2.3-2 대응</text><rect x="86" y="366" width="568" height="8" rx="4" fill="#f4f4f5"/><rect 