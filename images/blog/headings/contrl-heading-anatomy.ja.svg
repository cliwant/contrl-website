<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Contrlのスライド1枚の上部の構造：章番号と題はRFPが指定した目次に従うので評価者が見つけられ、見出しはウィンテーマから来る便益を語り、タグはそのページが答えるRFP要件を示す" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><title>Contrlのスライド1枚の上部の構造：章番号と題はRFPが指定した目次に従うので評価者が見つけられ、見出しはウィンテーマから来る便益を語り、タグはそのページが答えるRFP要件を示す</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="600" fill="#fff"/><text x="40" y="50.0" font-size="18" font-weight="700" fill="#71717a" text-anchor="start">スライド1枚の上部</text><text x="800" y="50.0" font-size="18" font-weight="700" fill="#b7551b" text-anchor="start">それぞれの役割</text><rect x="40" y="74" width="660" height="440" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><rect x="64" y="102" width="174.0" height="44" rx="10" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="80" y="131.0" font-size="20" font-weight="700" fill="#71717a" text-anchor="start">2.3  データ移行</text><rect x="64" y="178" width="6" height="92" rx="3" fill="#F27A2E"/><text x="86" y="212.0" font-size="30" font-weight="800" fill="#18181b" text-anchor="start">すべてのデータを二重に検証してから</text><text x="86" y="251.0" font-size="30" font-weight="800" fill="#18181b" text-anchor="start">切り替えます</text><rect x="86" y="296" width="218.68" height="32" rx="16" fill="#fffaf6" stroke="#F27A2E" stroke-width="1.5"/><text x="195.34" y="317.0" font-size="14" font-weight="700" fill="#b7551b" text-anchor="middle">RFP要件2.3-1、2.3-2に対応</text><rect x="86" y="366" width="568" height="8" rx="4" fill="#f4f4f5"/><rect x="86" y="386" width="522.5600000000001" height="8" rx="4" fill="#f4f4f5"/><rect x="86" y="406" width="550.96" height="8" rx="4" fill="#f4f4f5"/><rect x="86" y="426" width="340.8" height="8" rx="4" fill="#f4f4f5"/><rect x="86" y="466" width="499.84" height="8" rx="4" fill="#f4f4f5"/><rect x="86" y="486" width="426.0" height="8" rx="4" fill="#f4f4f5"/><line x1="252.0" y1="124" x2="700" y2="124" stroke="#F27A2E" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><path d="M715 124 C756.5 124 756.5 118 798 118" fill="none" stroke="#F27A2E" stroke-width="2" stroke-dasharray="6 5"/><circle cx="700" cy="124" r="15" fill="#F27A2E" stroke="#F27A2E" stroke-width="2"/><text x="700" y="130.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="800" y="84" width="360" height="118" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><circle cx="832" cy="118" r="15" fill="#F27A2E" stroke="#F27A2E" stroke-width="2"/><text x="832" y="124.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="858" y="125.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">見つけられる</text><text x="824" y="160.0" font-size="16" font-weight="400" fill="#71717a" text-anchor="start">番号と題はRFPが指定した目次のとおり</text><line x1="559.0" y1="224" x2="700" y2="224" stroke="#F27A2E" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><path d="M715 224 C756.5 224 756.5 270 798 270" fill="none" stroke="#F27A2E" stroke-width="2" stroke-dasharray="6 5"/><circle cx="700" cy="224" r="15" fill="#F27A2E" stroke="#F27A2E" stroke-width="2"/><text x="700" y="230.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="800" y="236" width="360" height="118" rx="14" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><circle cx="832" cy="270" r="15" fill="#F27A2E" stroke="#F27A2E" stroke-width="2"/><text x="832" y="276.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="858" y="277.0" font-size="20" font-weight="700" fill="#b7551b" text-anchor="start">メッセージがある</text><text x="824" y="312.0" font-size="16" font-weight="400" fill="#71717a" text-anchor="start">見出しが便益を語る。</text><text x="824" y="333.6" font-size="16" font-weight="400" fill="#71717a" text-anchor="start">ウィンテーマから生まれた一文</text><line x1="318.68" y1="312" x2="700" y2="312" stroke="#F27A2E" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><path d="M715 312 C756.5 312 756.5 422 798 422" fill="none" stroke="#F27A2E" stroke-width="2" stroke-dasharray="6 5"/><circle cx="700" cy="312" r="15" fill="#F27A2E" stroke="#F27A2E" stroke-width="2"/><text x="700" y="318.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="800" y="388" width="360" height="118" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><circle cx="832" cy="422" r="15" fill="#F27A2E" stroke="#F27A2E" stroke-width="2"/><text x="832" y="428.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="858" y="429.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">たどれる</text><text x="824" y="464.0" font-size="16" font-weight="400" fill="#71717a" text-anchor="start">このページが答えるRFP要件を表示</text><text x="600.0" y="566.0" font-size="17" font-weight="400" fill="#71717a" text-anchor="middle">評価者はRFPの目次でページを見つけ、見出しでその意味を知ります。</text></svg>
