<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="제안요청서 전에는 팀이 고객의 걱정을 알아내고, 제안요청서가 나오면 Contrl이 그 기록을 윈 테마로 만든다" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>제안요청서 전에는 팀이 고객의 걱정을 알아내고, 제안요청서가 나오면 Contrl이 그 기록을 윈 테마로 만든다</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="560" fill="#fff"/><rect x="30" y="30" width="520" height="470" rx="16" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><rect x="650" y="30" width="520" height="470" rx="16" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="60" y="72.0" font-size="20" font-weight="700" fill="#71717a" text-anchor="start">제안요청서 전 · 우리 팀</text><text x="680" y="72.0" font-size="20" font-weight="700" fill="#b7551b" text-anchor="start">제안요청서 후 · Contrl에서</text><rect x="60" y="100" width="460" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><rect x="60" y="100" width="8" height="112" rx="4" fill="#F27A2E"/><text x="88" y="134.0" font-size="16" font-weight="700" fill="#b7551b" text-anchor="start">미팅 · 정보화 부서장</text><text x="88" y="166.0" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">“진짜 걱정은 야간 근무 중 장애예요.”</text><rect x="60" y="228" width="460" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><rect x="60" y="228" width="8" height="112" rx="4" fill="#F27A2E"/><text x="88" y="262.0" font-size="16" font-weight="700" fill="#b7551b" text-anchor="start">현장 방문</text><text x="88" y="294.0" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">“직원들이 같은 데이터를 두 번 입력해요.”</text><rect x="60" y="356" width="460" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><rect x="60" y="356" width="8" height="112" rx="4" fill="#F27A2E"/><text x="88" y="390.0" font-size="16" font-weight="700" fill="#b7551b" text-anchor="start">통화 · 사업 담당</text><text x="88" y="422.0" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">“지난 업체는 오픈 일정을 못 지켰어요.”</text><line x1="600" y1="40" x2="600" y2="490" stroke="#e2d6c9" stroke-width="2" stroke-dasharray="6 6"/><rect x="531.25" y="250" width="137.5" height="31" rx="15.5" fill="#18181b"/><text x="545.25" y="268.0" font-size="15" font-weight="700" fill="#fff" text-anchor="start">제안요청서 공고</text><line x1="552" y1="154" x2="676" y2="154" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="680" y="100" width="460" height="108" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="704" y="140.0" font-size="22" font-weight="700" fill="#18181b" text-anchor="start">전략 인터뷰</text><text x="704" y="176.0" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">미팅 기록을 채팅에 그대로 가져옵니다</text><line x1="910" y1="212" x2="910" y2="248" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="680" y="252" width="460" height="218" rx="12" fill="#fff" stroke="#F27A2E" stroke-width="2"/><text x="704" y="290.0" font-size="22" font-weight="700" fill="#b7551b" text-anchor="start">윈 테마</text><text x="704" y="336.0" font-size="17" font-weight="600" fill="#71717a" text-anchor="start">고객 니즈</text><text x="860" y="336.0" font-size="18" font-weight="600" fill="#18181b" text-anchor="start">야간 장애 제로</text><text x="704" y="384.0" font-size="17" font-weight="600" fill="#71717a" text-anchor="start">우리의 강점</text><text x="860" y="384.0" font-size="18" font-weight="600" fill="#18181b" text-anchor="start">검증된 단계적 전환</text><text x="704" y="432.0" font-size="17" font-weight="600" fill="#71717a" text-anchor="start">효과</text><text x="860" y="432.0" font-size="18" font-weight="600" fill="#18181b" text-anchor="start">운영이 멈추지 않음</text><text x="600.0" y="536.0" font-size="18" font-weight="400" fill="#71717a" text-anchor="middle">제안요청서 문구가 아니라 고객에게 직접 들은 것으로 만든 테마.</text></svg>
