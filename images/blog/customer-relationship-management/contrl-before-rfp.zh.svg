<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="招标前团队了解客户的担忧；招标后 Contrl 把这些记录变成制胜主题" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><title>招标前团队了解客户的担忧；招标后 Contrl 把这些记录变成制胜主题</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="560" fill="#fff"/><rect x="30" y="30" width="520" height="470" rx="16" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><rect x="650" y="30" width="520" height="470" rx="16" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="60" y="72.0" font-size="20" font-weight="700" fill="#71717a" text-anchor="start">招标前 · 我方团队</text><text x="680" y="72.0" font-size="20" font-weight="700" fill="#b7551b" text-anchor="start">招标后 · 在 Contrl 中</text><rect x="60" y="100" width="460" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><rect x="60" y="100" width="8" height="112" rx="4" fill="#F27A2E"/><text x="88" y="134.0" font-size="16" font-weight="700" fill="#b7551b" text-anchor="start">会面 · 信息化负责人</text><text x="88" y="166.0" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">“我真正担心的是夜班期间宕机。”</text><rect x="60" y="228" width="460" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><rect x="60" y="228" width="8" height="112" rx="4" fill="#F27A2E"/><text x="88" y="262.0" font-size="16" font-weight="700" fill="#b7551b" text-anchor="start">现场走访</text><text x="88" y="294.0" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">“员工要把同样的数据录两遍。”</text><rect x="60" y="356" width="460" height="112" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><rect x="60" y="356" width="8" height="112" rx="4" fill="#F27A2E"/><text x="88" y="390.0" font-size="16" font-weight="700" fill="#b7551b" text-anchor="start">电话 · 项目办公室</text><text x="88" y="422.0" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">“上一家供应商没能按时上线。”</text><line x1="600" y1="40" x2="600" y2="490" stroke="#e2d6c9" stroke-width="2" stroke-dasharray="6 6"/><rect x="541.0" y="250" width="118" height="31" rx="15.5" fill="#18181b"/><text x="555.0" y="268.0" font-size="15" font-weight="700" fill="#fff" text-anchor="start">发布招标文件</text><line x1="552" y1="154" x2="676" y2="154" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="680" y="100" width="460" height="108" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="704" y="140.0" font-size="22" font-weight="700" fill="#18181b" text-anchor="start">策略访谈</text><text x="704" y="176.0" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">把会面记录直接带进对话</text><line x1="910" y1="212" x2="910" y2="248" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="680" y="252" width="460" height="218" rx="12" fill="#fff" stroke="#F27A2E" stroke-width="2"/><text x="704" y="290.0" font-size="22" font-weight="700" fill="#b7551b" text-anchor="start">制胜主题</text><text x="704" y="336.0" font-size="17" font-weight="600" fill="#71717a" text-anchor="start">客户需求</text><text x="860" y="336.0" font-size="18" font-weight="600" fill="#18181b" text-anchor="start">夜班零宕机</text><text x="704" y="384.0" font-size="17" font-weight="600" fill="#71717a" text-anchor="start">我方优势</text><text x="860" y="384.0" font-size="18" font-weight="600" fill="#18181b" text-anchor="start">经过验证的分阶段切换</text><text x="704" y="432.0" font-size="17" font-weight="600" fill="#71717a" text-anchor="start">收益</text><text x="860" y="432.0" font-size="18" font-weight="600" fill="#18181b" text-anchor="start">业务不中断</text><text x="600.0" y="536.0" font-size="18" font-weight="400" fill="#71717a" text-anchor="middle">主题来自客户亲口说的话，而不是招标文件的措辞。</text></svg>
