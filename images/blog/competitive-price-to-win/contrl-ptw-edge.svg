<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Your team’s Price to Win findings about each rival and the target position go into Contrl’s strategy interview; of the proposed win themes, one whose edge needs more than the target price allows is set aside, and the one that fits the target position is chosen" font-family="'Pretendard', -apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Your team’s Price to Win findings about each rival and the target position go into Contrl’s strategy interview; of the proposed win themes, one whose edge needs more than the target price allows is set aside, and the one that fits the target position is chosen</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="560" fill="#fff"/><rect x="30" y="30" width="420" height="470" rx="20" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="56" y="72.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">Your Price to Win analysis</text><text x="56" y="102.0" font-size="16" font-weight="400" fill="#71717a" text-anchor="start">done by your analysts, outside Contrl</text><rect x="56" y="126" width="368" height="92" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="78" y="160.0" font-size="16" font-weight="700" fill="#71717a" text-anchor="start">Rival A</text><text x="78" y="192.0" font-size="18" font-weight="400" fill="#18181b" text-anchor="start">Lowest price, thin transition team</text><rect x="56" y="232" width="368" height="92" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="78" y="266.0" font-size="16" font-weight="700" fill="#71717a" text-anchor="start">Rival B · incumbent</text><text x="78" y="298.0" font-size="18" font-weight="400" fill="#18181b" text-anchor="start">Safe, but priced highest</text><rect x="56" y="346" width="368" height="128" rx="12" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="78" y="382.0" font-size="17" font-weight="700" fill="#b7551b" text-anchor="start">Target position</text><text x="78" y="418.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">B’s low risk at near A’s price</text><line x1="452" y1="280" x2="506" y2="280" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="510" y="30" width="660" height="470" rx="20" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="536" y="72.0" font-size="20" font-weight="700" fill="#b7551b" text-anchor="start">In Contrl</text><rect x="536" y="100" width="250" height="360" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="661" y="244.2" font-size="21" font-weight="700" fill="#18181b" text-anchor="middle">Strategy</text><text x="661" y="273.6" font-size="21" font-weight="700" fill="#18181b" text-anchor="middle">interview</text><text x="661" y="309.0" font-size="16" font-weight="400" fill="#71717a" text-anchor="middle">asks about the</text><text x="661" y="331.4" font-size="16" font-weight="400" fill="#71717a" text-anchor="middle">competition</text><text x="822" y="120.0" font-size="17" font-weight="700" fill="#71717a" text-anchor="start">Proposed win themes</text><path d="M788 220 C800 220 806 196 818 196" fill="none" stroke="#a1a1aa" stroke-width="2.5" marker-end="url(#ah-a1a1aa)"/><rect x="822" y="140" width="324" height="130" rx="12" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="6 6"/><text x="844" y="176.0" font-size="18" font-weight="600" fill="#71717a" text-anchor="start">Edge: the largest senior team</text><text x="844" y="207.4" font-size="15" font-weight="400" fill="#71717a" text-anchor="start">✕ Too costly for the target price</text><path d="M788 340 C800 340 806 364 818 364" fill="none" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="822" y="296" width="324" height="150" rx="12" fill="#18181b"/><text x="844" y="334.0" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Edge: low-risk transition on</text><text x="844" y="358.7" font-size="19" font-weight="700" fill="#fff" text-anchor="start">a lean team</text><text x="844" y="391.4" font-size="16" font-weight="600" fill="#fde3d2" text-anchor="start">✓ Fits the target position</text><rect x="1036.84" y="282" width="97.16" height="30" rx="15.0" fill="#F27A2E"/><text x="1050.84" y="299.0" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Your pick</text><text x="600.0" y="538.0" font-size="18" font-weight="400" fill="#71717a" text-anchor="middle">Contrl doesn’t set the price. Your Price to Win result decides which edge the win theme can promise.</text></svg>
