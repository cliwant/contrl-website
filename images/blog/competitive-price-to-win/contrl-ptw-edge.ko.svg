<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="경쟁사별 Price to Win 분석 결과와 목표 포지션을 Contrl 전략 인터뷰에 가져가면, 제안된 윈 테마 가운데 목표 가격으로 감당할 수 없는 강점은 제외하고 목표 포지션에 맞는 강점을 고른다" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>경쟁사별 Price to Win 분석 결과와 목표 포지션을 Contrl 전략 인터뷰에 가져가면, 제안된 윈 테마 가운데 목표 가격으로 감당할 수 없는 강점은 제외하고 목표 포지션에 맞는 강점을 고른다</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="560" fill="#fff"/><rect x="30" y="30" width="420" height="470" rx="20" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="56" y="72.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">우리 팀의 Price to Win 분석</text><text x="56" y="102.0" font-size="16" font-weight="400" fill="#71717a" text-anchor="start">분석 담당이 Contrl 밖에서 수행</text><rect x="56" y="126" width="368" height="92" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="78" y="160.0" font-size="16" font-weight="700" fill="#71717a" text-anchor="start">경쟁사 A</text><text x="78" y="192.0" font-size="18" font-weight="400" fill="#18181b" text-anchor="start">최저가, 전환 인력은 최소</text><rect x="56" y="232" width="368" height="92" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="78" y="266.0" font-size="16" font-weight="700" fill="#71717a" text-anchor="start">경쟁사 B · 현 수행사</text><text x="78" y="298.0" font-size="18" font-weight="400" fill="#18181b" text-anchor="start">안정적이지만 가격은 최고</text><rect x="56" y="346" width="368" height="128" rx="12" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="78" y="382.0" font-size="17" font-weight="700" fill="#b7551b" text-anchor="start">목표 포지션</text><text x="78" y="418.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">B 수준의 낮은 위험을</text><text x="78" y="446.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">A에 가까운 가격으로</text><line x1="452" y1="280" x2="506" y2="280" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="510" y="30" width="660" height="470" rx="20" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="536" y="72.0" font-size="20" font-weight="700" fill="#b7551b" text-anchor="start">Contrl에서</text><rect x="536" y="100" width="250" height="360" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="661" y="270.1" font-size="21" font-weight="700" fill="#18181b" text-anchor="middle">전략 인터뷰</text><text x="661" y="305.5" font-size="16" font-weight="400" fill="#71717a" text-anchor="middle">경쟁사 질문에 답하며</text><text x="822" y="120.0" font-size="17" font-weight="700" fill="#71717a" text-anchor="start">제안된 윈 테마</text><path d="M788 220 C800 220 806 196 818 196" fill="none" stroke="#a1a1aa" stroke-width="2.5" marker-end="url(#ah-a1a1aa)"/><rect x="822" y="140" width="324" height="130" rx="12" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="6 6"/><text x="844" y="176.0" font-size="18" font-weight="600" fill="#71717a" text-anchor="start">강점: 최대 규모의 고급 인력</text><text x="844" y="207.4" font-size="15" font-weight="400" fill="#71717a" text-anchor="start">✕ 목표 가격으로는 감당할 수 없음</text><path d="M788 340 C800 340 806 364 818 364" fill="none" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="822" y="296" width="324" height="150" rx="12" fill="#18181b"/><text x="844" y="334.0" font-size="19" font-weight="700" fill="#fff" text-anchor="start">강점: 소수 정예의 안정적 전환</text><text x="844" y="366.7" font-size="16" font-weight="600" fill="#fde3d2" text-anchor="start">✓ 목표 포지션에 맞음</text><rect x="1078" y="282" width="56" height="30" rx="15.0" fill="#F27A2E"/><text x="1092" y="299.0" font-size="14" font-weight="700" fill="#fff" text-anchor="start">선택</text><text x="600.0" y="538.0" font-size="18" font-weight="400" fill="#71717a" text-anchor="middle">가격은 Contrl이 정하지 않습니다. Price to Win 결과가 윈 테마가 약속할 강점을 정합니다.</text></svg>
