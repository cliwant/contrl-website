<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="競合ごとのPrice to Win分析の結果と目標ポジションをContrlの戦略インタビューに持ち込むと、提案されたウィンテーマのうち目標価格では支えられない強みは外し、目標ポジションに合う強みを選べる" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><title>競合ごとのPrice to Win分析の結果と目標ポジションをContrlの戦略インタビューに持ち込むと、提案されたウィンテーマのうち目標価格では支えられない強みは外し、目標ポジションに合う強みを選べる</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="560" fill="#fff"/><rect x="30" y="30" width="420" height="470" rx="20" fill="#f9f6f2" stroke="#e2d6c9" stroke-width="1.5"/><text x="56" y="72.0" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">自社のPrice to Win分析</text><text x="56" y="102.0" font-size="16" font-weight="400" fill="#71717a" text-anchor="start">分析担当がContrlの外で実施</text><rect x="56" y="126" width="368" height="92" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="78" y="160.0" font-size="16" font-weight="700" fill="#71717a" text-anchor="start">競合A</text><text x="78" y="192.0" font-size="18" font-weight="400" fill="#18181b" text-anchor="start">最安値、移行要員は最小限</text><rect x="56" y="232" width="368" height="92" rx="12" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="78" y="266.0" font-size="16" font-weight="700" fill="#71717a" text-anchor="start">競合B · 現行業者</text><text x="78" y="298.0" font-size="18" font-weight="400" fill="#18181b" text-anchor="start">安心感はあるが価格は最高</text><rect x="56" y="346" width="368" height="128" rx="12" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="78" y="382.0" font-size="17" font-weight="700" fill="#b7551b" text-anchor="start">目標ポジション</text><text x="78" y="418.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">B並みの低リスクを</text><text x="78" y="446.0" font-size="20" font-weight="700" fill="#18181b" text-anchor="start">Aに近い価格で</text><line x1="452" y1="280" x2="506" y2="280" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="510" y="30" width="660" height="470" rx="20" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="536" y="72.0" font-size="20" font-weight="700" fill="#b7551b" text-anchor="start">Contrlで</text><rect x="536" y="100" width="250" height="360" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><text x="661" y="270.1" font-size="21" font-weight="700" fill="#18181b" text-anchor="middle">戦略インタビュー</text><text x="661" y="305.5" font-size="16" font-weight="400" fill="#71717a" text-anchor="middle">競合についての質問に答える</text><text x="822" y="120.0" font-size="17" font-weight="700" fill="#71717a" text-anchor="start">提案されたウィンテーマ</text><path d="M788 220 C800 220 806 196 818 196" fill="none" stroke="#a1a1aa" stroke-width="2.5" marker-end="url(#ah-a1a1aa)"/><rect x="822" y="140" width="324" height="130" rx="12" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="6 6"/><text x="844" y="176.0" font-size="18" font-weight="600" fill="#71717a" text-anchor="start">強み：最大規模の上級チーム</text><text x="844" y="207.4" font-size="15" font-weight="400" fill="#71717a" text-anchor="start">✕ 目標価格では支えられない</text><path d="M788 340 C800 340 806 364 818 364" fill="none" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><rect x="822" y="296" width="324" height="150" rx="12" fill="#18181b"/><text x="844" y="334.0" font-size="19" font-weight="700" fill="#fff" text-anchor="start">強み：少数精鋭で</text><text x="844" y="358.7" font-size="19" font-weight="700" fill="#fff" text-anchor="start">低リスクな移行</text><text x="844" y="391.4" font-size="16" font-weight="600" fill="#fde3d2" text-anchor="start">✓ 目標ポジションに合う</text><rect x="1078" y="282" width="56" height="30" rx="15.0" fill="#F27A2E"/><text x="1092" y="299.0" font-size="14" font-weight="700" fill="#fff" text-anchor="start">選択</text><text x="600.0" y="538.0" font-size="18" font-weight="400" fill="#71717a" text-anchor="middle">価格はContrlが決めるのではありません。Price to Winの結果が、ウィンテーマで約束できる強みを決めます。</text></svg>
