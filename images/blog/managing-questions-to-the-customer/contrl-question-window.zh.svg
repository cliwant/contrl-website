<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="用两条时间线比较同一个招标答疑期。手工拆解招标文件占去大部分时间，问题在截止前才提交，答复也在最后一批才到。使用Contrl时，第一天就提取出需求、目录和评分标准，技术、合同和财务人员审阅同一份清单，重要问题尽早提交并在第一批得到答复，留出调整方案的时间" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"><title>用两条时间线比较同一个招标答疑期。手工拆解招标文件占去大部分时间，问题在截止前才提交，答复也在最后一批才到。使用Contrl时，第一天就提取出需求、目录和评分标准，技术、合同和财务人员审阅同一份清单，重要问题尽早提交并在第一批得到答复，留出调整方案的时间</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="540" fill="#fff"/><text x="40" y="52.0" font-size="22" font-weight="800" fill="#18181b" text-anchor="start">同一个答疑期，两种用法</text><rect x="30" y="140" width="1140" height="136" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><rect x="30" y="296" width="1140" height="150" rx="14" fill="#f9f6f2" stroke="#F27A2E" stroke-width="2"/><text x="50" y="214.0" font-size="17" font-weight="800" fill="#71717a" text-anchor="start">手工拆解</text><text x="50" y="377.0" font-size="17" font-weight="800" fill="#b7551b" text-anchor="start">使用Contrl</text><text x="230" y="104.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="start">发布招标</text><line x1="230" y1="116" x2="230" y2="456" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5 5"/><text x="640" y="104.0" font-size="15" font-weight="800" fill="#b7551b" text-anchor="middle">提问截止</text><line x1="640" y1="116" x2="640" y2="456" stroke="#F27A2E" stroke-width="2" stroke-dasharray="5 5"/><text x="830" y="104.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">最后答复</text><line x1="830" y1="116" x2="830" y2="456" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5 5"/><text x="1150" y="104.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="end">提交投标</text><line x1="1150" y1="116" x2="1150" y2="456" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="230" y="168" width="310" height="44" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/><text x="385.0" y="195.4" font-size="15" font-weight="700" fill="#71717a" text-anchor="middle">手工拆解招标文件</text><circle cx="562" cy="190" r="12" fill="#a1a1aa"/><text x="562" y="195.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Q</text><circle cx="590" cy="190" r="12" fill="#a1a1aa"/><text x="590" y="195.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Q</text><line x1="606" y1="190" x2="814" y2="190" stroke="#a1a1aa" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah-a1a1aa)"/><circle cx="830" cy="190" r="13" fill="#a1a1aa"/><text x="830" y="195.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">A</text><rect x="850" y="176" width="300" height="28" rx="8" fill="#fff" stroke="#a1a1aa" stroke-width="1.5"/><text x="1000.0" y="194.7" font-size="13" font-weight="600" fill="#71717a" text-anchor="middle">几乎没有时间调整方案</text><text x="600" y="244.0" font-size="14" font-weight="600" fill="#71717a" text-anchor="end">截止前才提问</text><rect x="812" y="230" width="106" height="21" rx="3" fill="#fff"/><text x="816" y="244.0" font-size="14" font-weight="600" fill="#71717a" text-anchor="start">最后一批才答复</text><rect x="230" y="318" width="70" height="44" rx="8" fill="#F27A2E"/><text x="265.0" y="345.4" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">提取</text><rect x="306" y="318" width="214" height="44" rx="8" fill="#fffaf6" stroke="#F27A2E" stroke-width="1.5"/><text x="413.0" y="345.4" font-size="15" font-weight="700" fill="#b7551b" text-anchor="middle">团队审阅</text><circle cx="540" cy="340" r="12" fill="#F27A2E"/><text x="540" y="345.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Q</text><circle cx="566" cy="340" r="12" fill="#F27A2E"/><text x="566" y="345.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Q</text><line x1="580" y1="340" x2="596" y2="340" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><circle cx="612" cy="340" r="13" fill="#F27A2E"/><text x="612" y="345.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">A</text><rect x="632" y="318" width="518" height="44" rx="8" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="891.0" y="345.0" font-size="15" font-weight="800" fill="#b7551b" text-anchor="middle">有时间调整方案、价格和目录</text><text x="236" y="388.0" font-size="13" font-weight="600" fill="#b7551b" text-anchor="start">第一天：</text><text x="236" y="405.6" font-size="13" font-weight="600" fill="#b7551b" text-anchor="start">需求、目录、</text><text x="236" y="423.1" font-size="13" font-weight="600" fill="#b7551b" text-anchor="start">评分标准</text><text x="345" y="388.0" font-size="13" font-weight="600" fill="#71717a" text-anchor="start">技术 · 合同 · 财务</text><rect x="594" y="374" width="92" height="21" rx="3" fill="#f9f6f2"/><text x="598" y="388.0" font-size="14" font-weight="700" fill="#b7551b" text-anchor="start">第一批即答复</text><text x="40" y="496.0" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">同样的招标文件，同样的截止日。第一天完成拆解，答疑期就能用来写好问题。</text></svg>
