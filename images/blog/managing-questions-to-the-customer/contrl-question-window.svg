<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Two timelines of the same RFP question window. By hand, breaking down the RFP fills most of the window, questions go in just before the deadline and are answered in the last batch. With Contrl, requirements, outline and evaluation criteria are extracted on day one, technical, contracts and finance review one list, important questions go in early and are answered in the first batch, leaving time to change the plan" font-family="'Pretendard', -apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Two timelines of the same RFP question window. By hand, breaking down the RFP fills most of the window, questions go in just before the deadline and are answered in the last batch. With Contrl, requirements, outline and evaluation criteria are extracted on day one, technical, contracts and finance review one list, important questions go in early and are answered in the first batch, leaving time to change the plan</title><defs><marker id="ah-F27A2E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F27A2E"/></marker><marker id="ah-a1a1aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker></defs><rect width="1200" height="540" fill="#fff"/><text x="40" y="52.0" font-size="22" font-weight="800" fill="#18181b" text-anchor="start">One question window, two ways to spend it</text><rect x="30" y="140" width="1140" height="136" rx="14" fill="#fff" stroke="#e2d6c9" stroke-width="1.5"/><rect x="30" y="296" width="1140" height="150" rx="14" fill="#f9f6f2" stroke="#F27A2E" stroke-width="2"/><text x="50" y="214.0" font-size="17" font-weight="800" fill="#71717a" text-anchor="start">By hand</text><text x="50" y="377.0" font-size="17" font-weight="800" fill="#b7551b" text-anchor="start">With Contrl</text><text x="230" y="104.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="start">RFP released</text><line x1="230" y1="116" x2="230" y2="456" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5 5"/><text x="640" y="104.0" font-size="15" font-weight="800" fill="#b7551b" text-anchor="middle">Question deadline</text><line x1="640" y1="116" x2="640" y2="456" stroke="#F27A2E" stroke-width="2" stroke-dasharray="5 5"/><text x="830" y="104.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Last answers</text><line x1="830" y1="116" x2="830" y2="456" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5 5"/><text x="1150" y="104.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="end">Proposal due</text><line x1="1150" y1="116" x2="1150" y2="456" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="230" y="168" width="310" height="44" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/><text x="385.0" y="195.4" font-size="15" font-weight="700" fill="#71717a" text-anchor="middle">Breaking down the RFP by hand</text><circle cx="562" cy="190" r="12" fill="#a1a1aa"/><text x="562" y="195.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Q</text><circle cx="590" cy="190" r="12" fill="#a1a1aa"/><text x="590" y="195.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Q</text><line x1="606" y1="190" x2="814" y2="190" stroke="#a1a1aa" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah-a1a1aa)"/><circle cx="830" cy="190" r="13" fill="#a1a1aa"/><text x="830" y="195.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">A</text><rect x="850" y="176" width="300" height="28" rx="8" fill="#fff" stroke="#a1a1aa" stroke-width="1.5"/><text x="1000.0" y="194.7" font-size="13" font-weight="600" fill="#71717a" text-anchor="middle">Little time left to change the plan</text><text x="600" y="244.0" font-size="14" font-weight="600" fill="#71717a" text-anchor="end">Questions at the last minute</text><rect x="812" y="230" width="196.72" height="21" rx="3" fill="#fff"/><text x="816" y="244.0" font-size="14" font-weight="600" fill="#71717a" text-anchor="start">Answers in the last batch</text><rect x="230" y="318" width="70" height="44" rx="8" fill="#F27A2E"/><text x="265.0" y="345.4" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Extract</text><rect x="306" y="318" width="214" height="44" rx="8" fill="#fffaf6" stroke="#F27A2E" stroke-width="1.5"/><text x="413.0" y="345.4" font-size="15" font-weight="700" fill="#b7551b" text-anchor="middle">Team review</text><circle cx="540" cy="340" r="12" fill="#F27A2E"/><text x="540" y="345.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Q</text><circle cx="566" cy="340" r="12" fill="#F27A2E"/><text x="566" y="345.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Q</text><line x1="580" y1="340" x2="596" y2="340" stroke="#F27A2E" stroke-width="3" marker-end="url(#ah-F27A2E)"/><circle cx="612" cy="340" r="13" fill="#F27A2E"/><text x="612" y="345.0" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">A</text><rect x="632" y="318" width="518" height="44" rx="8" fill="#fffaf6" stroke="#F27A2E" stroke-width="2"/><text x="891.0" y="345.0" font-size="15" font-weight="800" fill="#b7551b" text-anchor="middle">Time to update solution, price and outline</text><text x="236" y="388.0" font-size="13" font-weight="600" fill="#b7551b" text-anchor="start">Day one:</text><text x="236" y="405.6" font-size="13" font-weight="600" fill="#b7551b" text-anchor="start">requirements,</text><text x="236" y="423.1" font-size="13" font-weight="600" fill="#b7551b" text-anchor="start">outline, criteria</text><text x="345" y="388.0" font-size="13" font-weight="600" fill="#71717a" text-anchor="start">Technical · contracts · finance</text><rect x="594" y="374" width="205.12" height="21" rx="3" fill="#f9f6f2"/><text x="598" y="388.0" font-size="14" font-weight="700" fill="#b7551b" text-anchor="start">Answers in the first batch</text><text x="40" y="496.0" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">Same RFP, same deadline. When the breakdown is done on day one, the window is spent on asking good questions.</text></svg>
