# main 에 머지(푸시)되면 Firebase Hosting 프로젝트 contrl-ai 의 라이브 채널로 배포한다.
#
# contrl.ai 는 CloudFront 뒤에서 이 Firebase 사이트(contrl-ai.web.app)를 원본으로 쓴다.
# HTML 과 디렉터리 URL 은 firebase.json 에서 Cache-Control: no-cache 로 내려가므로, 배포 뒤에는
# CloudFront 가 다음 요청에서 원본을 다시 확인해 contrl.ai 에도 바로 반영된다.
# 단 이 설정이 처음 적용되는 첫 배포 한 번은 CloudFront 에 남은 옛 응답(max-age=3600) 때문에 최대 1시간이
# 걸리므로, 첫 배포가 성공한 뒤에 CloudFront 무효화를 한 번 실행한다.
#
# 처음 한 번 필요한 설정(저장소 관리자):
#   1) GCP 프로젝트 contrl-ai 에서 배포용 서비스 계정을 만들고 JSON 키를 받는다.
#      역할: Firebase Hosting Admin, API Keys Viewer
#   2) 키 JSON 을 한 줄로 줄여(jq -c . 키파일.json) 저장소 시크릿 FIREBASE_SERVICE_ACCOUNT_CONTRL_AI 로 등록한다.
# 시크릿이 없거나 서비스 계정 키(type=service_account)가 아니면 이 워크플로는 실패하고 배포하지 않는다.
# 저장소 시크릿은 쓰기 권한이 있는 사람이 자기 브랜치의 워크플로로 읽을 수 있다.
#
# 수동 재배포는 Actions 탭의 Run workflow 로 한다(main 만 배포됨).
# Re-run 은 그 실행의 옛 커밋을 다시 배포하므로 최신 내용을 올릴 때는 쓰지 않는다.
# 실행이 빨갛더라도 라이브가 갱신됐을 수 있으니 contrl-ai.web.app 에서 실제 반영을 확인한다.
# .github 아래만 바뀐 푸시는 사이트가 달라지지 않으므로 배포하지 않는다.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치지 않게 한 번에 하나씩 처리한다. 진행 중인 배포는 끝까지 두고,
# 대기 중인 실행은 더 새로운 실행으로 대체되므로 마지막에는 항상 가장 최신 main 이 배포된다.
concurrency:
  group: firebase-hosting-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy_live_website:
    # 수동 실행으로 다른 브랜치를 라이브에 올리는 일을 막는다(실수 방지용이며 접근 통제는 아니다)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deployments 탭에 배포 기록이 남는다.
    # Settings > Environments > production 에서 Required reviewers 를 지정하면 배포 전에 승인을 받게 할 수 있다.
    environment:
      name: production
      url: https://contrl.ai
    steps:
      - name: Check deploy secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTRL_AI }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error title=Deploy secret missing::저장소 시크릿 FIREBASE_SERVICE_ACCOUNT_CONTRL_AI 가 없어 배포하지 못했습니다. 이 파일 맨 위의 설정을 확인하세요."
            exit 1
          fi
          if ! printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -e '.type == "service_account" and (.client_email | type == "string") and (.private_key | type == "string")' > /dev/null 2>&1; then
            echo "::error title=Deploy secret invalid::FIREBASE_SERVICE_ACCOUNT_CONTRL_AI 가 서비스 계정 키 JSON(type=service_account)이 아닙니다. OAuth 클라이언트 JSON 같은 다른 값을 넣지 않았는지 확인하세요."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .gitattributes 가 *.mp4 를 Git LFS 로 보내므로, 영상이 추가돼도 포인터 파일이 배포되지 않게 한다
          lfs: true
          persist-credentials: false

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTRL_AI }}
          projectId: contrl-ai
          channelId: live
          firebaseToolsVersion: 15.34.0
