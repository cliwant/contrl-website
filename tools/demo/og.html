<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
@font-face { font-family: 'Freesentation'; src: url('http://localhost:8080/fonts/Freesentation-8ExtraBold.ttf') format('truetype'); font-weight: 800; }
html,body { margin:0; }
body { width:1200px; height:630px; background:#faf7f2; font-family:'Pretendard',sans-serif; color:#18181b; position:relative; overflow:hidden; }
.glow { position:absolute; right:-160px; top:-160px; width:620px; height:620px; border-radius:50%; background:radial-gradient(circle, rgba(242,122,46,.22), rgba(242,122,46,0) 65%); }
.wrap { position:absolute; inset:0; padding:72px 84px; display:flex; flex-direction:column; justify-content:space-between; }
.logo { font-size:40px; font-weight:800; letter-spacing:-.03em; }
.logo b { color:#F27A2E; }
h1 { font-family:'Freesentation','Pretendard',sans-serif; font-weight:800; letter-spacing:-.03em; font-size:70px; line-height:1.08; margin:0; white-space:nowrap; }
h1 .a { color:#F27A2E; }
.tag { font-size:30px; color:#52525b; font-weight:500; }
.tag b { color:#18181b; font-weight:700; }
.url { position:absolute; right:84px; top:80px; font-size:26px; font-weight:700; color:#a1a1aa; }
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="logo">contrl<b>.</b></div>
  <h1>You're not underusing AI.<br><span class="a">You're giving it too much control.</span></h1>
  <div class="tag"><b>You make the call, AI writes on your behalf.</b></div>
</div>
<div class="url">contrl.ai</div>
</body></html>
